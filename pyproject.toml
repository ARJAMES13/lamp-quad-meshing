[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamp-mesh"
version = "1.0.0"
description = "LAMP: learned controller over QuadWild and Gmsh QQS for budget-matched quad meshing of CAD solids"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
